# Project, database and volume names stay "clipforge" on purpose (the app was renamed ClipBit):
# changing them would start an empty database (volumes are clipforge_pgdata, clipforge_mediadata, ...).
name: clipforge

x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgres://clipforge:clipforge@postgres:5432/clipforge
    REDIS_URL: redis://redis:6379
    WHISPER_URL: http://whisper:9000
    DATA_DIR: /data
  # lets the containers reach Ollama running on your PC
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: clipforge
      POSTGRES_DB: clipforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipforge"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  whisper:
    build: ./whisper
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - whispermodels:/models
    restart: unless-stopped

  # Web dashboard + REST API
  app:
    build: .
    <<: *app-env
    command: ["node", "server/dist/server.js"]
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      # recordings, rendered Shorts and thumbnails live on the host (default D:\clipforge-data)
      - ${DATA_PATH:-D:/clipforge-data}:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # Background workers: stream recorder, AI analysis, clip rendering, uploads, stats
  worker:
    build: .
    <<: *app-env
    command: ["node", "server/dist/worker.js"]
    volumes:
      - ${DATA_PATH:-D:/clipforge-data}:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      app: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  whispermodels:
